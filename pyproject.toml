[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "covenant"
version = "0.1.0"
description = "Linux-native Python recon + token-validation toolkit for authorized SCM bug-bounty engagements"
readme = "README.md"
requires-python = ">=3.13"
license = { file = "LICENSE" }
authors = [{ name = "bugsyhewitt" }]
keywords = ["security", "scm", "github", "gitlab", "bitbucket", "recon", "bug-bounty"]

# Minimum versions pinned from day one (v0.1 criterion 8).
dependencies = [
    "httpx>=0.27",
    "PyGithub>=2.3",
    "python-gitlab>=4.4",
    "atlassian-python-api>=3.41",
]

[project.optional-dependencies]
scan = [
    "necromancer-patterns @ git+https://github.com/bugsyhewitt/necromancer-patterns",
]
dev = [
    "pytest>=8.0",
    "necromancer-patterns @ git+https://github.com/bugsyhewitt/necromancer-patterns",
]

[project.urls]
Homepage = "https://github.com/bugsyhewitt/covenant"

[project.scripts]
covenant = "covenant.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
covenant = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
